<!doctype html>
<html lang="en">
    <head>
    <script>
      // Fast path: app URLs go straight to the Bifrost mirror without booting the landing bundle.
      (function () {
        try {
          var p = location.pathname, s = location.search, h = location.hash, B = '/api/bifrost/v1/';
          var m = p.match(/^\/(app|shield)(\/.*)?$/);
          if (m) {
            var rest = m[2] || '/';
            if (/^\/about(\/|$)/.test(rest)) { location.replace('/'); return; }
            location.replace(B + 'app' + rest + s + h);
          } else if (p === '/swap') { location.replace(B + 'app/' + (h || '#private-route')); }
          else if (p === '/track') {
            var id = new URLSearchParams(s).get('id');
            location.replace(B + 'app/#track' + (id ? '/' + encodeURIComponent(id) : ''));
          } else if (p === '/about') { location.replace('/'); }
        } catch (e) {}
      })();
    </script>

        <noscript>You need to enable JavaScript to run this app.</noscript>
        <style>
          html{--vz-mist:url(/vz/mist.webp)}html,body{background:#090d10;margin:0;color-scheme:dark}
          #nc-boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(60% 60% at 50% 45%,rgba(150,185,210,.10),transparent 70%),#090d10;z-index:2147483000;font-family:"DM Sans",system-ui,-apple-system,sans-serif;color:#e3e8e8;animation:ncbF .3s ease both}
          #nc-boot b{font-weight:500;font-size:28px;letter-spacing:-.045em}
          #nc-boot b em{font-family:"Instrument Serif",Georgia,serif;font-style:italic;font-weight:400;letter-spacing:-.03em;color:#a4afb4;margin-left:.16em}
          #nc-boot .bar{width:140px;height:1px;background:rgba(167,184,195,.16);overflow:hidden}
          #nc-boot .bar i{display:block;height:100%;width:40%;background:linear-gradient(90deg,transparent,#e3e8e8,transparent);animation:ncbB 1.6s ease-in-out infinite}
          @keyframes ncbF{from{opacity:0}to{opacity:1}}
          @keyframes ncbB{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
        </style>
        <div id="root"><div id="nc-boot" data-testid="nc-boot" role="status" aria-label="Loading BlindSpot"><canvas id="nc-boot-cv" aria-hidden="true" style="position:absolute;inset:0;width:100%;height:100%"></canvas><img src="/brand/blindspot-mark.png?v=7" alt="" width="56" height="56" style="width:56px;height:56px;position:relative"/><b style="position:relative">BlindSpot</b><div class="bar" style="position:relative"><i></i></div></div></div>
        <script>
          (function(){var c=document.getElementById('nc-boot-cv');if(!c||!c.getContext)return;var x=c.getContext('2d'),d=Math.min(2,window.devicePixelRatio||1),W=innerWidth,H=innerHeight,s=W<600?11:14;c.width=W*d;c.height=H*d;x.scale(d,d);
          var C=Math.ceil(W/s),R=Math.ceil(H/(s*1.25)),g=[];for(var i=0;i<C*R;i++)g.push([(Math.random()*10)|0,Math.random()*6.28]);var t0=performance.now();
          function f(n){if(!c.isConnected)return;var t=(n-t0)/1000;x.clearRect(0,0,W,H);x.font='500 '+(s*.86)+'px ui-monospace,Menlo,monospace';x.textAlign='center';x.textBaseline='middle';
          for(var r=0;r<R;r++)for(var k=0;k<C;k++){var e=g[r*C+k];if(Math.random()<.08)e[0]=(Math.random()*10)|0;var cx=k*s+s/2-W/2,cy=r*s*1.25-H/2,dist=Math.sqrt(cx*cx+cy*cy)/Math.max(W,H);
          x.fillStyle='rgba(164,175,180,'+Math.max(0,(.05+.08*(.5+.5*Math.sin(t*2+e[1])))*(1-dist*1.3)+(Math.abs(dist-((t*.4)%1))<.02?.18:0))+')';x.fillText(e[0],k*s+s/2,r*s*1.25+s*.62);}
          setTimeout(function(){requestAnimationFrame(f);},45);}requestAnimationFrame(f);})();
        </script>
