<!doctype html>
<html lang="en">
    <head>
    <script>
      // Fast path: app URLs go straight to the Bifrost mirror without booting the landing bundle.
      (function () {
        try {
          var p = location.pathname, s = location.search, h = location.hash, B = '/api/bifrost/v1/';
          var m = p.match(/^\/(app|shield)(\/.*)?$/);
          if (m) {
            var rest = m[2] || '/';
            if (/^\/about(\/|$)/.test(rest)) { location.replace('/'); return; }
            location.replace(B + 'app' + rest + s + h);
          } else if (p === '/swap') { location.replace(B + 'app/' + (h || '#private-route')); }
          else if (p === '/track') {
            var id = new URLSearchParams(s).get('id');
            location.replace(B + 'app/#track' + (id ? '/' + encodeURIComponent(id) : ''));
          } else if (p === '/about') { location.replace('/'); }
        } catch (e) {}
      })();
    </script>
